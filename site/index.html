<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 模型缩略图浏览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">3D 模型缩略图浏览</div>
    <input id="search" type="search" placeholder="搜索模型名称…" autocomplete="off">
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div class="side-title">目录</div>
      <div id="folders" class="folders"></div>
    </aside>

    <main>
      <div class="toolbar">
        <span id="count"></span>
        <div class="toolbar-right">
          <div class="size-ctl">
            <button type="button" data-size="s">小</button>
            <button type="button" data-size="m" class="active">中</button>
            <button type="button" data-size="l">大</button>
          </div>
          <span id="status"></span>
        </div>
      </div>
      <div id="gallery" class="gallery"></div>
      <div id="empty" class="empty hidden">没有找到匹配的模型</div>
    </main>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lb-backdrop"></div>
    <div class="lb-box">
      <button class="lb-close" type="button" aria-label="关闭">×</button>
      <img id="lb-img" alt="">
      <div id="lb-info"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
